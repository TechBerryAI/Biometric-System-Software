services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-biometric}
      POSTGRES_USER: ${POSTGRES_USER:-biometric}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-biometric} -d ${POSTGRES_DB:-biometric}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    # Horizontal scale: run multiple API replicas behind a load balancer.
    #   docker compose -f docker-compose.prod.yml up --scale api=3
    # Sticky sessions are not required (JWT/cookie auth is stateless aside from Redis).
    # Ensure REDIS_URL and DATABASE_URL (optionally DATABASE_READ_URL) are shared.
    # deploy.replicas is informational for swarm; use --scale for compose.
    deploy:
      replicas: 2
    image: ${API_IMAGE:-biometric-api:latest}
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.api
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-biometric}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-biometric}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      JSON_LOGS: "true"
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318/v1/traces}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    image: ${WORKER_IMAGE:-biometric-worker:latest}
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.worker
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-biometric}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-biometric}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      JSON_LOGS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    command: celery -A app.workers.celery_app:celery_app worker --loglevel=INFO -Q device_commands,attendance_sync,reconciliation,notifications --concurrency=2

  beat:
    image: ${WORKER_IMAGE:-biometric-worker:latest}
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-biometric}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-biometric}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      JSON_LOGS: "true"
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app:celery_app beat --loglevel=INFO

  frontend:
    image: ${FRONTEND_IMAGE:-biometric-frontend:latest}
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
