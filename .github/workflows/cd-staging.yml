name: CD Staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: cd-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Render Helm manifest
        run: |
          helm template biometric-platform deploy/helm/biometric-platform \
            --namespace biometric-platform \
            --set image.api.repository=${{ vars.STAGING_API_IMAGE || 'ghcr.io/example/biometric-api' }} \
            --set image.api.tag=${{ github.sha }} \
            --set image.worker.repository=${{ vars.STAGING_WORKER_IMAGE || 'ghcr.io/example/biometric-worker' }} \
            --set image.worker.tag=${{ github.sha }} \
            --set image.frontend.repository=${{ vars.STAGING_FRONTEND_IMAGE || 'ghcr.io/example/biometric-frontend' }} \
            --set image.frontend.tag=${{ github.sha }} \
            --set config.environment=staging \
            > /tmp/biometric-staging.yaml

      - name: Deploy to staging cluster
        env:
          KUBECONFIG_DATA: ${{ secrets.STAGING_KUBECONFIG }}
        run: |
          if [ -z "$KUBECONFIG_DATA" ]; then
            echo "STAGING_KUBECONFIG secret not configured — rendering manifest only."
            cat /tmp/biometric-staging.yaml
            exit 0
          fi
          echo "$KUBECONFIG_DATA" | base64 -d > "$RUNNER_TEMP/kubeconfig"
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          kubectl apply -f deploy/k8s/namespace.yaml
          kubectl apply -f /tmp/biometric-staging.yaml

      - name: Smoke check staging API
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |
          if [ -z "$STAGING_URL" ]; then
            echo "STAGING_URL not configured — skipping smoke check."
            exit 0
          fi
          curl -fsS "$STAGING_URL/health"
