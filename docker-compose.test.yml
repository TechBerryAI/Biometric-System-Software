# E2E / integration test stack — ephemeral, no host volume mounts for app code.
# Usage:
#   docker compose -f docker-compose.test.yml up -d --build
#   docker compose -f docker-compose.test.yml run --rm api pytest tests/ -q --cov=app --cov-fail-under=85
#   docker compose -f docker-compose.test.yml down -v

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: biometric_test
      POSTGRES_USER: biometric
      POSTGRES_PASSWORD: biometric
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biometric -d biometric_test"]
      interval: 5s
      timeout: 3s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.api
    environment:
      DATABASE_URL: postgresql+psycopg://biometric:biometric@postgres:5432/biometric_test
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: test
      JWT_SECRET_KEY: test-jwt-secret-key-not-for-prod
      ENCRYPTION_KEY: test-encryption-key-not-for-prod
      CSRF_ENABLED: "false"
      AUTH_COOKIE_ENABLED: "false"
      DEVICE_AUTO_SYNC_ENABLED: "false"
      JSON_LOGS: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.worker
    environment:
      DATABASE_URL: postgresql+psycopg://biometric:biometric@postgres:5432/biometric_test
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: test
      DEVICE_AUTO_SYNC_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app:celery_app worker --loglevel=INFO -Q device_commands,attendance_sync,reconciliation,notifications --concurrency=1

  e2e:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.api
    environment:
      DATABASE_URL: postgresql+psycopg://biometric:biometric@postgres:5432/biometric_test
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: test
      JWT_SECRET_KEY: test-jwt-secret-key-not-for-prod
      ENCRYPTION_KEY: test-encryption-key-not-for-prod
      CSRF_ENABLED: "false"
      AUTH_COOKIE_ENABLED: "false"
      DEVICE_AUTO_SYNC_ENABLED: "false"
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
    profiles: ["e2e"]
    command: >
      sh -c "alembic upgrade head &&
             pytest tests/unit tests/api tests/integration tests/workers -q --tb=short --cov=app --cov-fail-under=85"
