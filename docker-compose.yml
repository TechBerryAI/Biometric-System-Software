services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: biometric
      POSTGRES_USER: biometric
      POSTGRES_PASSWORD: biometric
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biometric -d biometric"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.api
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://biometric:biometric@postgres:5432/biometric
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      JSON_LOGS: "true"
      OTEL_ENABLED: "false"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.worker
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://biometric:biometric@postgres:5432/biometric
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      JSON_LOGS: "true"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    command: celery -A app.workers.celery_app:celery_app worker --loglevel=INFO -Q device_commands,attendance_sync,reconciliation,notifications

  beat:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.worker
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://biometric:biometric@postgres:5432/biometric
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      JSON_LOGS: "true"
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app:celery_app beat --loglevel=INFO

  frontend:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.frontend
      args:
        VITE_API_URL: /api
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
