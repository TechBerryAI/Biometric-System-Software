# Host ports avoid clashing with a local PostgreSQL (5432) or Redis (6379).
# From the host: Postgres localhost:5433, Redis localhost:6380.
# Inside the compose network services still use postgres:5432 and redis:6379.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: biometric
      POSTGRES_PASSWORD: biometric
      POSTGRES_DB: biometric
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biometric -d biometric"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://biometric:biometric@postgres:5432/biometric
      REDIS_URL: redis://redis:6379/0
      ZK_DEVICE_IP: ${ZK_DEVICE_IP:-192.168.1.200}
      ZK_DEVICE_PORT: ${ZK_DEVICE_PORT:-4370}
      ZK_DEVICE_PASSWORD: ${ZK_DEVICE_PASSWORD:-0}
      ZK_DEVICE_TIMEOUT_SECONDS: ${ZK_DEVICE_TIMEOUT_SECONDS:-30}
      ZK_DEVICE_ID: ${ZK_DEVICE_ID:-main-entrance}
      ZK_FORCE_UDP: ${ZK_FORCE_UDP:-false}
      ZK_OMIT_PING: ${ZK_OMIT_PING:-false}
      TIMEZONE: ${TIMEZONE:-UTC}
      DEVICE_POLL_INTERVAL_SECONDS: ${DEVICE_POLL_INTERVAL_SECONDS:-120}
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    entrypoint: ["/docker-entrypoint.sh"]
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-l", "info"]
    environment:
      SKIP_MIGRATIONS: "1"
      DATABASE_URL: postgresql+psycopg://biometric:biometric@postgres:5432/biometric
      REDIS_URL: redis://redis:6379/0
      ZK_DEVICE_IP: ${ZK_DEVICE_IP:-192.168.1.200}
      ZK_DEVICE_PORT: ${ZK_DEVICE_PORT:-4370}
      ZK_DEVICE_PASSWORD: ${ZK_DEVICE_PASSWORD:-0}
      ZK_DEVICE_TIMEOUT_SECONDS: ${ZK_DEVICE_TIMEOUT_SECONDS:-30}
      ZK_DEVICE_ID: ${ZK_DEVICE_ID:-main-entrance}
      ZK_FORCE_UDP: ${ZK_FORCE_UDP:-false}
      ZK_OMIT_PING: ${ZK_OMIT_PING:-false}
      TIMEZONE: ${TIMEZONE:-UTC}
      DEVICE_POLL_INTERVAL_SECONDS: ${DEVICE_POLL_INTERVAL_SECONDS:-120}
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    entrypoint: ["/docker-entrypoint.sh"]
    command: ["celery", "-A", "app.workers.celery_app", "beat", "-l", "info"]
    environment:
      SKIP_MIGRATIONS: "1"
      DATABASE_URL: postgresql+psycopg://biometric:biometric@postgres:5432/biometric
      REDIS_URL: redis://redis:6379/0
      ZK_DEVICE_IP: ${ZK_DEVICE_IP:-192.168.1.200}
      ZK_DEVICE_PORT: ${ZK_DEVICE_PORT:-4370}
      ZK_DEVICE_PASSWORD: ${ZK_DEVICE_PASSWORD:-0}
      ZK_DEVICE_TIMEOUT_SECONDS: ${ZK_DEVICE_TIMEOUT_SECONDS:-30}
      ZK_DEVICE_ID: ${ZK_DEVICE_ID:-main-entrance}
      ZK_FORCE_UDP: ${ZK_FORCE_UDP:-false}
      ZK_OMIT_PING: ${ZK_OMIT_PING:-false}
      TIMEZONE: ${TIMEZONE:-UTC}
      DEVICE_POLL_INTERVAL_SECONDS: ${DEVICE_POLL_INTERVAL_SECONDS:-120}
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
