apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "biometric-platform.fullname" . }}-api
spec:
  replicas: {{ .Values.replicaCount.api }}
  selector:
    matchLabels:
      app: api
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: api
        release: {{ .Release.Name }}
    spec:
      initContainers:
        - name: migrate
          image: "{{ .Values.image.api.repository }}:{{ .Values.image.api.tag }}"
          imagePullPolicy: {{ .Values.image.api.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              value: {{ include "biometric-platform.databaseUrl" . | quote }}
      containers:
        - name: api
          image: "{{ .Values.image.api.repository }}:{{ .Values.image.api.tag }}"
          imagePullPolicy: {{ .Values.image.api.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: {{ include "biometric-platform.databaseUrl" . | quote }}
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "biometric-platform.fullname" . }}-config
                  key: REDIS_URL
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "biometric-platform.fullname" . }}-config
                  key: ENVIRONMENT
            - name: JSON_LOGS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "biometric-platform.fullname" . }}-config
                  key: JSON_LOGS
            - name: OTEL_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "biometric-platform.fullname" . }}-config
                  key: OTEL_ENABLED
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "biometric-platform.fullname" . }}-secrets
                  key: JWT_SECRET_KEY
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "biometric-platform.fullname" . }}-secrets
                  key: ENCRYPTION_KEY
          resources:
            {{- toYaml .Values.resources.api | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
    release: {{ .Release.Name }}
  ports:
    - port: 8000
      targetPort: 8000
