apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "biometric-platform.fullname" . }}-config
data:
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  REDIS_URL: redis://redis:6379/0
  ENVIRONMENT: {{ .Values.config.environment | quote }}
  JSON_LOGS: {{ .Values.config.jsonLogs | quote }}
  OTEL_ENABLED: {{ .Values.config.otelEnabled | quote }}
  CORS_ALLOW_ORIGINS: {{ .Values.config.corsAllowOrigins | quote }}
  VITE_API_URL: /api
