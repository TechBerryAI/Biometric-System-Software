apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: biometric-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      initContainers:
        - name: migrate
          image: biometric-api:latest
          command: ["alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              value: postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: biometric-config
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: biometric-config
                  key: POSTGRES_DB
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: biometric-secrets
                  key: POSTGRES_PASSWORD
      containers:
        - name: api
          image: biometric-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: biometric-config
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: biometric-config
                  key: POSTGRES_DB
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: biometric-secrets
                  key: POSTGRES_PASSWORD
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: biometric-config
                  key: REDIS_URL
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: biometric-config
                  key: ENVIRONMENT
            - name: JSON_LOGS
              valueFrom:
                configMapKeyRef:
                  name: biometric-config
                  key: JSON_LOGS
            - name: OTEL_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: biometric-config
                  key: OTEL_ENABLED
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: biometric-secrets
                  key: JWT_SECRET_KEY
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: biometric-secrets
                  key: ENCRYPTION_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: biometric-platform
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
