groups:
  - name: biometric-attendance
    rules:
      - alert: BiometricApiDown
        expr: up{job="biometric-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Biometric API is unreachable
          description: Prometheus cannot scrape the biometric-api /metrics endpoint for more than 2 minutes.

      - alert: BiometricHighErrorRate
        expr: |
          sum(rate(http_requests_total{job="biometric-api",status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(http_requests_total{job="biometric-api"}[5m])), 0.001)
          > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Elevated 5xx error rate on biometric API
          description: More than 5% of API requests are returning 5xx over the last 5 minutes.

      - alert: BiometricHighLatencyP95
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(http_request_duration_seconds_bucket{job="biometric-api"}[5m])) by (le)
          ) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Biometric API p95 latency above 2s
          description: 95th percentile request latency has exceeded 2 seconds for 10 minutes.

      - alert: BiometricDeviceQueueBacklog
        expr: biometric_queue_depth > 50
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Device command queue backlog is high
          description: Operational queue depth has remained above 50 for 15 minutes.

      - alert: BiometricDeadLetterCommands
        expr: biometric_dead_letter_commands > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Dead-letter device commands detected
          description: At least one device command is in DEAD_LETTER state.

      - alert: BiometricFailingDevices
        expr: biometric_failing_devices > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: One or more biometric devices are offline or degraded
          description: Device health reports OFFLINE or DEGRADED status for more than 10 minutes.

      - alert: BiometricReconciliationPending
        expr: biometric_reconciliation_pending > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Device reconciliation drift pending
          description: User/mapping drift has been pending reconciliation for over 30 minutes.

      - alert: BiometricStaleCommands
        expr: biometric_stale_commands > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Stale device commands detected
          description: RUNNING or VERIFYING commands without recent heartbeat for more than 10 minutes.
