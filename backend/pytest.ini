[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
markers =
    testid: Traceability matrix test ID
    slow: Slow integration or scenario tests
    integration: Requires transactional DB / simulator
    load: Load / locust-related tests
    device_sim: Simulated multi-device fleet tests
filterwarnings =
    ignore::DeprecationWarning

# Coverage gate enforced by make test-backend-cov / CI (--cov-fail-under=85).
# Also configured here so `pytest --cov=app` alone applies the same threshold.
[coverage:report]
fail_under = 85
show_missing = true
